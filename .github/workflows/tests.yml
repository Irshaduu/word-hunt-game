name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # The manifest static storage needs collected files before any template renders.
      - run: python manage.py collectstatic --noinput
      # No DB_HOST here, so the tests run on SQLite, as they do locally.
      - run: python manage.py test game
